name: Build and Push Docker Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - tag_suffix: el5
            dockerfile: ./docker/Dockerfile.centos5
            build_args: |
          - tag_suffix: el6
            dockerfile: ./docker/Dockerfile.centos
            build_args: |
              VERSION_NUM=6
          - tag_suffix: el7
            dockerfile: ./docker/Dockerfile.centos
            build_args: |
              VERSION_NUM=7
          - tag_suffix: el8
            dockerfile: ./docker/Dockerfile.centos-stream
            build_args: |
              VERSION_NUM=8
          - tag_suffix: el9
            dockerfile: ./docker/Dockerfile.centos-stream
            build_args: |
              VERSION_NUM=9
          - tag_suffix: amzn1
            dockerfile: ./docker/Dockerfile.amazonlinux
            build_args: |
              VERSION_NUM=1
              BUILD_TOPDIR=el6
              EXPECTED_RPM_DIST=amzn1
          - tag_suffix: amzn2
            dockerfile: ./docker/Dockerfile.amazonlinux
            build_args: |
              VERSION_NUM=2
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=amzn2
          - tag_suffix: amzn2023
            dockerfile: ./docker/Dockerfile.amazonlinux
            build_args: |
              VERSION_NUM=2023
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=amzn2023
          - tag_suffix: oe2003sp4
            dockerfile: ./docker/Dockerfile.openeuler
            build_args: |
              VERSION_NUM=20.03-lts-sp4
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=oe2003sp4
          - tag_suffix: oe2203sp4
            dockerfile: ./docker/Dockerfile.openeuler
            build_args: |
              VERSION_NUM=22.03-lts-sp4
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=oe2203sp4
          - tag_suffix: oe2403sp2
            dockerfile: ./docker/Dockerfile.openeuler
            build_args: |
              VERSION_NUM=24.03-lts-sp2
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=oe2403sp2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set normalized GHCR image name
        id: image-name
        run: |
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "value=$image_name" >> "$GITHUB_OUTPUT"

      - name: Pull Sources for CentOS 5
        if: matrix.tag_suffix == 'el5'
        run: |
          env DOCKERBUILD=1 ./pullsrc.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}:${{ matrix.tag_suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - tag_suffix: aarch64_el7
            dockerfile: ./docker/Dockerfile.centos
            build_args: |
              VERSION_NUM=7
          - tag_suffix: aarch64_el8
            dockerfile: ./docker/Dockerfile.centos-stream
            build_args: |
              VERSION_NUM=8
          - tag_suffix: aarch64_el9
            dockerfile: ./docker/Dockerfile.centos-stream
            build_args: |
              VERSION_NUM=9
          - tag_suffix: aarch64_amzn2
            dockerfile: ./docker/Dockerfile.amazonlinux
            build_args: |
              VERSION_NUM=2
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=amzn2
          - tag_suffix: aarch64_amzn2023
            dockerfile: ./docker/Dockerfile.amazonlinux
            build_args: |
              VERSION_NUM=2023
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=amzn2023
          - tag_suffix: aarch64_oe2003sp4
            dockerfile: ./docker/Dockerfile.openeuler
            build_args: |
              VERSION_NUM=20.03-lts-sp4
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=oe2003sp4
          - tag_suffix: aarch64_oe2203sp4
            dockerfile: ./docker/Dockerfile.openeuler
            build_args: |
              VERSION_NUM=22.03-lts-sp4
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=oe2203sp4
          - tag_suffix: aarch64_oe2403sp2
            dockerfile: ./docker/Dockerfile.openeuler
            build_args: |
              VERSION_NUM=24.03-lts-sp2
              BUILD_TOPDIR=el7
              EXPECTED_RPM_DIST=oe2403sp2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set normalized GHCR image name
        id: image-name
        run: |
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "value=$image_name" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag_suffix }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}:${{ matrix.tag_suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

